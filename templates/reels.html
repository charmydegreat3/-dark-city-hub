<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DARK CITY HUB | Reels</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .reels-feed {
            height: calc(100vh - 65px);
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            background: #080808;
        }

        .reel-card {
            height: calc(100vh - 65px);
            min-height: 450px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: start;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .reel-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .reel-info {
            position: absolute;
            left: 16px;
            bottom: 22px;
            right: 16px;
            color: white;
            text-shadow: 0 1px 5px #000;
            pointer-events: none;
        }

        .reel-info a {
            color: white;
            pointer-events: auto;
        }

        .reel-actions {
            position: absolute;
            right: 15px;
            bottom: 100px;
        }

        .reel-actions form,
        .reel-actions button {
            pointer-events: auto;
        }

        .reel-actions button {
            background: #a855f7;
            color: white;
            border: 0;
            border-radius: 20px;
            padding: 10px 14px;
        }

        .empty-reels {
            color: white;
            text-align: center;
            padding: 50px 20px;
        }
    </style>
</head>
<body>

<header class="topbar">
    <h2>DARK CITY HUB</h2>
    <a href="{{ url_for('home') }}">Home</a>
</header>

<main class="reels-feed">
    {% if posts %}
        {% for post in posts %}
            <section class="reel-card">
                <video class="reel-video autoplay-video" muted loop
                       controls
                       playsinline
                       preload="metadata">
                    <source src="{{ url_for('static', filename='uploads/' + post.image) }}">
                    Your browser does not support video.
                </video>

                <div class="reel-info">
                    <strong>
                        <a href="{{ url_for('profile', username=post.user.username) }}">
                            @{{ post.user.username }}
                        </a>
                    </strong>
                    {% if post.caption %}
                        <p>{{ post.caption }}</p>
                    {% endif %}
                </div>

                <div class="reel-actions">
                    <form action="{{ url_for('like', post_id=post.id) }}" method="POST">
                        <button type="submit">
                            {% if post.id in liked_ids %}♥ Unlike{% else %}♡ Like{% endif %}
                        </button>
                    </form>
                    <p style="color:white;">{{ post.likes|length }} likes</p>
                </div>
            </section>
        {% endfor %}
    {% else %}
        <div class="empty-reels">
            <h2>No Reels yet</h2>
            <p>Be the first to share a Reel with your community.</p>
            <a href="{{ url_for('create') }}">Create a Reel</a>
        </div>
    {% endif %}
</main>


<script>
document.addEventListener("DOMContentLoaded", function () {
    const videos = document.querySelectorAll(".autoplay-video");

    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            const video = entry.target;

            if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        });
    }, { threshold: [0, 0.6, 1] });

    videos.forEach(video => observer.observe(video));
});
</script>

</body>
</html>
